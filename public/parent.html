<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Portal — Diamond School</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; min-height: 100vh; }
  .topbar { background:#1e3a5f; color:#fff; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:56px; }
  .topbar h1 { font-size:17px; font-weight:600; }
  .btn-logout { background:rgba(255,255,255,0.15); border:none; color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  .btn-logout:hover { background:rgba(255,255,255,0.25); }
  .content { padding:24px; max-width:900px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:20px; }
  .card h2 { font-size:16px; font-weight:600; color:#1e3a5f; margin-bottom:18px; border-bottom:1px solid #e2e8f0; padding-bottom:12px; }
  .child-strip { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:#4a5568; margin-bottom:18px; }
  .child-strip strong { color:#1a202c; }
  .exam-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .exam-tabs button { background:#edf2f7; border:none; padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; color:#4a5568; cursor:pointer; }
  .exam-tabs button.active { background:#1e3a5f; color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th { text-align:left; padding:8px 10px; font-size:12px; color:#718096; font-weight:600; border-bottom:2px solid #e2e8f0; }
  tbody td { padding:8px 10px; border-bottom:1px solid #f0f4f8; }
  .muted { color:#718096; font-size:13px; }
  .summary-row { display:flex; flex-wrap:wrap; gap:14px; margin-top:16px; }
  .summary-tile { background:#f7fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 16px; min-width:120px; }
  .summary-tile .l { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#718096; }
  .summary-tile .v { font-size:1.2rem; font-weight:700; color:#1e3a5f; }
  .diary-entry { border:1px solid #e2e8f0; border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .diary-entry .d-date { font-weight:700; color:#1e3a5f; margin-bottom:4px; }
  .diary-entry .d-field { font-size:.85rem; margin:2px 0; }
  .diary-entry .d-field b { color:#4a5568; }
  .error-box { background:#fff5f5; color:#c53030; padding:10px 14px; border-radius:6px; font-size:.85rem; margin-bottom:14px; }
  .btn-primary { background:#2d6a9f; color:#fff; border:none; border-radius:7px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary:hover { background:#1e3a5f; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🏫 Diamond / Hidayah School — Parent Portal</h1>
  <button class="btn-logout" id="logout-btn">Log Out</button>
</div>
<div class="content">
  <div id="loading" class="muted">Loading...</div>
  <div id="content" style="display:none;">
    <div class="card" id="select-card">
      <h2>Select School, Class &amp; Roll No.</h2>
      <div class="child-strip" id="child-strip"></div>
      <div style="display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px;">
        <div style="flex:1; min-width:180px;">
          <label style="display:block; font-size:12px; font-weight:600; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;">School</label>
          <select id="sel-school" disabled style="width:100%; padding:9px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:14px;"></select>
        </div>
        <div style="flex:1; min-width:120px;">
          <label style="display:block; font-size:12px; font-weight:600; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;">Class</label>
          <select id="sel-class" disabled style="width:100%; padding:9px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:14px;"></select>
        </div>
        <div style="flex:1; min-width:100px;">
          <label style="display:block; font-size:12px; font-weight:600; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;">Roll No.</label>
          <input id="sel-roll" disabled style="width:100%; padding:9px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:14px;">
        </div>
      </div>
      <button class="btn-primary" id="view-result-btn" style="width:auto; padding:11px 28px;">View Result</button>
      <button id="toggle-add-child-btn" style="width:auto; margin-left:10px; padding:11px 18px; background:transparent; border:1px solid #cbd5e0; border-radius:7px; font-size:13px; font-weight:600; color:#4a5568; cursor:pointer;">+ Add another child</button>

      <div id="add-child-form" style="display:none; margin-top:18px; padding-top:18px; border-top:1px solid #e2e8f0;">
        <div style="display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px;">
          <div style="flex:1; min-width:180px;">
            <label style="display:block; font-size:12px; font-weight:600; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;">School</label>
            <select id="ac-school" style="width:100%; padding:9px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:14px;"></select>
          </div>
          <div style="flex:1; min-width:120px;">
            <label style="display:block; font-size:12px; font-weight:600; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;">Class</label>
            <select id="ac-class" style="width:100%; padding:9px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:14px;"></select>
          </div>
          <div style="flex:1; min-width:100px;">
            <label style="display:block; font-size:12px; font-weight:600; color:#4a5568; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;">Roll No.</label>
            <input id="ac-roll" placeholder="e.g. 12" style="width:100%; padding:9px 12px; border:1px solid #cbd5e0; border-radius:7px; font-size:14px;">
          </div>
        </div>
        <button class="btn-primary" id="add-child-submit-btn" style="width:auto; padding:10px 24px;">Add Child</button>
        <div id="add-child-error" class="error-box" style="display:none; margin-top:12px;"></div>
      </div>
    </div>

    <div class="exam-tabs" id="exam-tabs" style="display:none;">
      <button data-exam="unit_test_1">Unit Test 1</button>
      <button data-exam="unit_test_2">Unit Test 2</button>
      <button data-exam="term_1">Term 1</button>
      <button data-exam="term_2">Term 2</button>
      <button data-exam="diary">Daily Diary</button>
    </div>

    <div class="card" id="result-card" style="display:none;">
      <h2 id="result-title">Result</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Subject</th><th>Total Marks</th><th>Obtained Marks</th></tr></thead>
          <tbody id="result-tbody"></tbody>
        </table>
      </div>
      <p class="muted" id="result-empty" style="display:none;">No marks recorded yet for this exam.</p>
      <div class="summary-row" id="result-summary"></div>
    </div>

    <div class="card" id="diary-card" style="display:none;">
      <h2>Daily Diary</h2>
      <div id="diary-list"></div>
      <p class="muted" id="diary-empty" style="display:none;">No diary entries recorded yet.</p>
    </div>
  </div>
  <div id="error-box" style="display:none;"></div>
</div>

<script>
const EXAM_LABELS = { unit_test_1:'Unit Test 1', unit_test_2:'Unit Test 2', term_1:'Term 1', term_2:'Term 2' };

// Same school → class list used on the registration form (public/index.html),
// kept in sync manually since this is a separate static page.
const SCHOOL_CLASSES = {
  'Diamond English Medium School & Junior College, Solapur': ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'],
  'Hidayah English Medium School, Solapur': ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th'],
  'Hidayah Pre-Primary School, Solapur': ['LKG','UKG'],
};

let children = [];
let activeStudentId = null;
let currentExam = 'unit_test_1';

async function api(url, opts) {
  const res = await fetch(url, { headers: {'Content-Type':'application/json'}, ...opts });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function populateAddChildClasses() {
  const schoolSel = document.getElementById('ac-school');
  const classSel = document.getElementById('ac-class');
  classSel.innerHTML = '';
  (SCHOOL_CLASSES[schoolSel.value] || []).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    classSel.appendChild(opt);
  });
}

async function init() {
  try {
    const me = await api('/api/auth/me');
    if (!me.user || me.user.role !== 'parent') { window.location.href = '/'; return; }

    const schoolSel = document.getElementById('ac-school');
    Object.keys(SCHOOL_CLASSES).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      schoolSel.appendChild(opt);
    });
    schoolSel.addEventListener('change', populateAddChildClasses);
    populateAddChildClasses();

    await loadChildren();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
    document.querySelectorAll('.exam-tabs button').forEach(btn => {
      btn.addEventListener('click', () => selectExam(btn.dataset.exam, btn));
    });
    document.getElementById('view-result-btn').addEventListener('click', () => {
      document.getElementById('exam-tabs').style.display = '';
      selectExam('unit_test_1', document.querySelector('.exam-tabs button[data-exam="unit_test_1"]'));
    });
    document.getElementById('toggle-add-child-btn').addEventListener('click', () => {
      const form = document.getElementById('add-child-form');
      form.style.display = form.style.display === 'none' ? '' : 'none';
    });
    document.getElementById('add-child-submit-btn').addEventListener('click', addChild);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = '';
    document.getElementById('error-box').innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`;
  }
}

async function loadChildren() {
  const data = await api('/api/parent/me');
  children = data.children || [data.student];
  activeStudentId = data.student.id;
  renderChildStrip();
  renderActiveChild();
}

function renderChildStrip() {
  const strip = document.getElementById('child-strip');
  if (children.length <= 1) { strip.innerHTML = ''; return; }
  strip.innerHTML = children.map(c => `
    <button class="child-chip${c.id === activeStudentId ? ' active' : ''}" data-id="${c.id}"
      style="padding:6px 14px; border-radius:20px; border:1px solid ${c.id === activeStudentId ? '#2d6a9f' : '#cbd5e0'};
      background:${c.id === activeStudentId ? '#2d6a9f' : '#fff'}; color:${c.id === activeStudentId ? '#fff' : '#4a5568'};
      font-size:13px; font-weight:600; cursor:pointer;">${escapeHtml(c.name)}</button>
  `).join('');
  strip.querySelectorAll('.child-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStudentId = parseInt(btn.dataset.id, 10);
      renderChildStrip();
      renderActiveChild();
      if (document.getElementById('exam-tabs').style.display !== 'none') selectExam(currentExam);
    });
  });
}

function renderActiveChild() {
  const student = children.find(c => c.id === activeStudentId);
  if (!student) return;
  document.getElementById('sel-school').innerHTML = `<option>${escapeHtml(student.school)}</option>`;
  document.getElementById('sel-class').innerHTML = `<option>${escapeHtml(student.class_name)}${student.division?' - '+escapeHtml(student.division):''}</option>`;
  document.getElementById('sel-roll').value = student.roll_no || '-';
}

async function addChild() {
  const school = document.getElementById('ac-school').value;
  const class_name = document.getElementById('ac-class').value;
  const roll_no = document.getElementById('ac-roll').value.trim();
  const errEl = document.getElementById('add-child-error');
  errEl.style.display = 'none';
  if (!school || !class_name || !roll_no) { errEl.textContent = 'All fields are required.'; errEl.style.display = ''; return; }
  try {
    await api('/api/parent/children', { method: 'POST', body: JSON.stringify({ school, class_name, roll_no }) });
    document.getElementById('ac-roll').value = '';
    document.getElementById('add-child-form').style.display = 'none';
    await loadChildren();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = '';
  }
}

function selectExam(exam, btnEl) {
  currentExam = exam;
  document.querySelectorAll('.exam-tabs button').forEach(b => b.classList.remove('active'));
  if (!btnEl) btnEl = document.querySelector(`.exam-tabs button[data-exam="${exam}"]`);
  if (btnEl) btnEl.classList.add('active');
  if (exam === 'diary') {
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('diary-card').style.display = '';
    loadDiary();
  } else {
    document.getElementById('diary-card').style.display = 'none';
    document.getElementById('result-card').style.display = '';
    loadResult(exam);
  }
}

async function loadResult(exam) {
  const tbody = document.getElementById('result-tbody');
  const summary = document.getElementById('result-summary');
  const empty = document.getElementById('result-empty');
  document.getElementById('result-title').textContent = EXAM_LABELS[exam] + ' Result';
  tbody.innerHTML = ''; summary.innerHTML = ''; empty.style.display = 'none';
  try {
    const data = await api(`/api/parent/result?exam=${exam}&student_id=${activeStudentId}`);
    if (!data.subjects.length) { empty.style.display = ''; return; }
    tbody.innerHTML = data.subjects.map(r => `<tr>
      <td>${escapeHtml(r.subject)}</td><td>${r.total}</td><td>${r.obtained}</td>
    </tr>`).join('');
    summary.innerHTML = `
      <div class="summary-tile"><div class="l">Grand Total</div><div class="v">${data.obtained_total} / ${data.grand_total}</div></div>
      <div class="summary-tile"><div class="l">Percentage</div><div class="v">${data.percentage}%</div></div>
      <div class="summary-tile"><div class="l">Grade</div><div class="v">${escapeHtml(data.grade||'-')}</div></div>
      <div class="summary-tile" style="flex:1;"><div class="l">Remarks</div><div class="v" style="font-size:.95rem;">${escapeHtml(data.remarks||'-')}</div></div>
    `;
  } catch (e) {
    empty.style.display = '';
    empty.textContent = e.message;
  }
}

async function loadDiary() {
  const list = document.getElementById('diary-list');
  const empty = document.getElementById('diary-empty');
  list.innerHTML = ''; empty.style.display = 'none';
  try {
    const rows = await api('/api/parent/diary?student_id=' + activeStudentId);
    if (!rows.length) { empty.style.display = ''; return; }
    list.innerHTML = rows.map(r => `<div class="diary-entry">
      <div class="d-date">${escapeHtml(r.entry_date)}</div>
      ${r.classwork ? `<div class="d-field"><b>Classwork:</b> ${escapeHtml(r.classwork)}</div>` : ''}
      ${r.homework ? `<div class="d-field"><b>Homework:</b> ${escapeHtml(r.homework)}</div>` : ''}
      ${r.activity ? `<div class="d-field"><b>Activity:</b> ${escapeHtml(r.activity)}</div>` : ''}
      ${r.behaviour ? `<div class="d-field"><b>Behaviour:</b> ${escapeHtml(r.behaviour)}</div>` : ''}
      ${r.remarks ? `<div class="d-field"><b>Remarks:</b> ${escapeHtml(r.remarks)}</div>` : ''}
    </div>`).join('');
  } catch (e) {
    empty.style.display = '';
    empty.textContent = e.message;
  }
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST' });
  window.location.href = '/';
});

init();
</script>
</body>
</html>
